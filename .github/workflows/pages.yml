# Публикация сайта-презентации «ИИ в работе с командой» на GitHub Pages.
# Источник сборки — изолированный каталог проекта projects/ai-team-management-program.
# Требуется однократная настройка: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages — ИИ в работе с командой

on:
  push:
    branches: [main]
    paths:
      - "projects/ai-team-management-program/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./projects/ai-team-management-program
          destination: ./_site

      - name: Check site against content/ (SSOT)
        run: |
          python3 projects/ai-team-management-program/tests/check_contrast.py
          SITE_DIR=_site python3 -m unittest discover -s projects/ai-team-management-program/tests -p "test_*.py" -v
          python3 projects/ai-team-management-program/tests/check_site.py --site _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)"
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=Pages source::Источник GitHub Pages — «${build_type}». Включите Settings → Pages → Build and deployment → Source: GitHub Actions и перезапустите workflow."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
