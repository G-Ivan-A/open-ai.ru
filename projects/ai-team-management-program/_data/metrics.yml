# content/02-project-passport.md, «Уровень 5. Уровни оценки эффективности».
evaluation:
  - level: "L1. Реакция"
    measure: "Удовлетворённость и готовность рекомендовать"
    tool: "CSAT и NPS в LMS"
    when: "После недель 1, 6, 11"
    target: "CSAT ≥ 4,5 из 5; NPS ≥ 50"
  - level: "L2. Научение"
    measure: "Качество промптов и агентов"
    tool: "Проверка промптов участника на эталонном тестовом наборе синтетических данных"
    when: "Неделя 5, неделя 11 (день 1)"
    target: "≥ 80% тестовых запросов дают ответ, соответствующий эталону"
  - level: "L3. Поведение"
    measure: "Применение в работе"
    tool: "Демонстрация прототипа на демо-дне; журнал применения"
    when: "Неделя 11"
    target: "≥ 80% участников с работающим прототипом"
  - level: "L4. Результат"
    measure: "Влияние на бизнес-метрики"
    tool: "Прогноз: экономия времени по журналу × число руководителей × стоимость часа; эффект дашборда на сроки поручений"
    when: "Неделя 11, отчёт спонсору"
    target: "Экономия 15–20% времени на рутинных задачах"
