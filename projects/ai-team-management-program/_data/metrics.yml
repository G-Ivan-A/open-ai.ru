# Лендинг-хук: 4 счётчика.
# Счётчик hours не хранит число: оно считается в шаблоне как сумма часов _data/timeline.yml
# и сверяется со строкой «Итого» паспорта (tests/check_site.py).
counters:
  - id: hours
    unit: "а.ч."
    label: "академический час · 11 недель"
    note: "content/02-project-passport.md: «91 академический час»"
  - id: offline
    value: 3
    unit: ""
    label: "очных блока по 2 дня"
    note: "content/01-project-summary.md: «3 очных блока»; content/02-project-passport.md, уровень 4"
  - id: practice
    value: 80
    unit: "%"
    label: "практики: теория — 18 а.ч. из 91"
    note: "content/01-project-summary.md, «Почему так»"
  - id: prototype
    value: 80
    unit: "%"
    label: "участников показывают работающий прототип в JustAI на демо-дне"
    note: "content/02-project-passport.md, уровень 1, KPI 1"

# «Почему это работает»: аргументы из content/01-project-summary.md, «Почему так»,
# со ссылкой на первоисточник из content/03-appendix.md, разделы [1] и [3].
why:
  - title: "Три месяца."
    text: "Привычка формируется в среднем за 66 дней; от первого очного блока до защиты проходит 70 дней."
    figure: "66 дней"
    source:
      label: "Lally et al., 2010"
      url: "https://doi.org/10.1002/ejsp.674"
  - title: "Разнесённые блоки."
    text: "Разнесённое обучение даёт перенос в работу 0,92 против 0,45 у интенсивов."
    figure: "0,92 против 0,45"
    source:
      label: "Lacerenza et al., 2017"
      url: "https://psihologijadela.com/wp-content/uploads/2018/02/leadership-training-design-delivery-and-implementation-a-meta-analysis.pdf"
  - title: "Нагрузка."
    text: "Не больше двух очных дней в месяц, онлайн — 3,75 астрономического часа в неделю."
    figure: "≤ 2 очных дня в месяц"
  - title: "Один инструмент."
    text: "Все кейсы, модели и данные — в JustAI: меньше переключений, один контур правил работы с данными."
    figure: "1 инструмент"
    source:
      label: "JustAI Agent Platform"
      url: "https://habr.com/ru/articles/1020686"
  - title: "80% практики."
    text: "Теория — 18 а.ч. из 91, остальное время участник строит своё."
    figure: "80%"

