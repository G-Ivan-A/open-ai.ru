# content/03-appendix.md, [1] «Ключевые выводы для дизайна программы».
findings:
  - decision: "Длительность 3 месяца"
    fact: "Медиана формирования привычки — 66 дней (96 участников, разброс 18–254 дня). От первого очного блока до защиты — 70 дней"
    source:
      label: "Lally et al., 2010"
      url: "https://doi.org/10.1002/ejsp.674"
  - decision: "Разнесённые блоки вместо интенсива"
    fact: "Мета-анализ 335 выборок, N = 26 573: разнесённое обучение даёт перенос в работу δ = 0,92 против 0,45 у сжатого формата"
    source:
      label: "Lacerenza et al., 2017"
      url: "https://psihologijadela.com/wp-content/uploads/2018/02/leadership-training-design-delivery-and-implementation-a-meta-analysis.pdf"
  - decision: "Обратная связь экспертов в каждом блоке"
    fact: "Обратная связь повышает перенос: δ = 1,40 против 0,50"
    source:
      label: "Lacerenza et al., 2017"
  - decision: "Защита на демо-дне вместо экзамена"
    fact: "Руководители высшего звена переносят обучение слабее всего: δ = 0,37 против 1,99 у низового звена"
    source:
      label: "Lacerenza et al., 2017"
  - decision: "Спонсор и задачи с рабочего места"
    fact: "Поддержка руководителя — предиктор переноса: r = 0,31; рабочая среда — r = 0,23 (89 исследований)"
    source:
      label: "Blume et al., 2010"
      url: "https://doi.org/10.1177/0149206309352880"
  - decision: "Ритм куратора и сеты"
    fact: "Выбывание из корпоративных программ — 18,45% после вмешательства (62 РКИ)"
    source:
      label: "de Miquel et al., 2024"
      url: "https://doi.org/10.5271/sjweh.4173"
  - decision: "Длительность выше рыночной медианы"
    fact: "Программы «ИИ для руководителей» в РФ: медиана около 1 месяца (22 программы); программы развития руководителей: медиана 6 месяцев (20 программ). 3 месяца соединяют ИИ-навык и управленческое поведение"
    source:
      label: "Обзор рынка, 42 программы"
  - decision: "Окно рынка"
    fact: "44% компаний не обучают руководителей работе с ИИ; интерес к ИИ-обучению — 51% респондентов в 2025 против 27% в 2024"
    source:
      label: "Б1, «Штат», Эксперт РА, hh.ru, 2025"
      url: "https://skillbox.ru/media/corptrain/6-nablyudeniy-iz-issledovaniya-o-sostoyanii-korporativnogo-obucheniya-v-rossii/"

# content/03-appendix.md, [3] «Обоснование единого стека (JustAI)».
stack:
  - criterion: "Когнитивная нагрузка"
    text: "Один интерфейс на всю программу: участник осваивает навык, а не набор инструментов. Время на переключение между платформами уходит в практику: 73 а.ч. из 91."
  - criterion: "Покрытие кейсов"
    text: "JustAI Agent Platform: no-code агенты, мультиагентные сценарии, триггеры чат, вебхук, расписание и почта; Jay Knowledge Hub: база знаний на RAG. Все 5 кейсов сетов собираются в одной платформе."
  - criterion: "Выбор модели по зоне данных"
    text: "Платформа подключает несколько моделей, включая российские модели и модели в контуре компании. Руководитель обучается классифицировать данные (зелёная, жёлтая, красная зона) и осознанно выбирать модель в интерфейсе JustAI в зависимости от уровня риска."
  - criterion: "Информационная безопасность"
    text: "Один контур правил: зоны данных и допуск моделей настраиваются один раз для всех кейсов. Jay Knowledge Hub разворачивается в контуре заказчика."
  - criterion: "Риск теневого ИИ"
    text: "38% обращений сотрудников к публичным ИИ-сервисам содержат конфиденциальную информацию (около 12 тыс. обращений, 150 компаний, первое полугодие 2026). Разрешённый инструмент с правилами зон снижает этот риск."
  - criterion: "Практика вендора"
    text: "Just AI работает с 2011 года и применяет внутри компании более 70 собственных ИИ-агентов."

