    format: "Онлайн"
    hours: 3
    block: "Старт"
    lead: "Куратор"
    topics: "Орг-сессия: ритм, правила, роли (1 а.ч.). Доступ в JustAI и LMS, первый запрос (1 а.ч.). Входная диагностика и журнал времени на рутину (1 а.ч.)"
