# Таймлайн программы: недели 0–11.
# SSOT: content/02-project-passport.md, «Уровень 3. Содержательный» → «Модульная структура».
# Поля format, hours, lead, topics, result переносятся из таблицы дословно.
# block — заголовок блока недель из content/01-project-summary.md, раздел «Программа».
# mode — служебное поле для фильтра «очно / онлайн»: offline для «Очно, 2 дня», online для «Онлайн».
# Сумма hours обязана совпадать со строкой «Итого» паспорта (проверка: tests/check_site.py).

weeks:
