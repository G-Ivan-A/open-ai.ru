    name: "Ведущий эксперт"
    task: "Стратегия ИИ-трансформации, управление изменениями, защита"
    requirement: "5+ лет в ИИ, опыт обучения руководителей"
  - id: ai-architect
    name: "ИИ-архитектор"
    task: "Агенты, RAG, дашборды, штурм-сессии"
    requirement: "Практика внедрений в JustAI, RAG-системы"
  - id: curator
    name: "Куратор"
    task: "Ритм, напоминания, LMS, очные дни"
    requirement: "Опыт blended learning; штатная роль Академии"
    note: "Куратор — штатная роль Академии, внешний подбор кандидатов не требуется."

