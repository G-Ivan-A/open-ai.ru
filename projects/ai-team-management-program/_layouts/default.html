<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta property="og:title" content="{{ site.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#14233d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="#top">{{ site.title }}</a>
      <nav class="site-nav" aria-label="{{ site.title }}">
        <ul>
          <li><a href="#summary">Резюме проекта</a></li>
          <li><a href="#passport">Паспорт проекта</a></li>
          <li><a href="#appendix">Приложение</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>{{ site.title }}</p>
    </div>
  </footer>
</body>
</html>
