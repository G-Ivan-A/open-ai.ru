# Сайт-презентация программы «ИИ в работе с командой».
# Изолированный Jekyll-проект портала open-ai.ru: источник сборки — этот каталог
# (см. .github/workflows/pages.yml в корне репозитория, шаг jekyll-build-pages, source).
# Тема не подключается: макеты, стили и скрипты лежат в этом каталоге.

title: "«ИИ в работе с командой»"
description: "11 недель от ручной рутины к собственным ИИ-агентам. Программа на 3 месяца для 20–25 руководителей."
lang: ru

# Адрес получателя запросов детального бюджета (форма «Запросить детальный бюджет»).
# Обязательное поле: без него публикация на main останавливается проверкой
# tests/check_site.py с сообщением, какой адрес указать.
budget_email: ""

# Тема письма с запросом бюджета.
budget_subject: "Запрос детального бюджета: «ИИ в работе с командой»"

# В сборку попадают только страница, макеты, данные и assets.
# content/ — копии исходных артефактов (SSOT): в них есть экономика, которая на сайте
# не публикуется, поэтому каталог исключён из сборки.
exclude:
  - README.md
  - content/
  - tests/
  - Gemfile
  - Gemfile.lock
  - vendor/
